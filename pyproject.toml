[project]
name = "molmcp"
version = "0.1.0"
description = "MCP servers for PyMOL and UCSF ChimeraX with in-app bridges, scene awareness and vision-free render analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10",
    "numpy>=1.24",
    "pillow>=10",
]

[project.scripts]
pymol-mcp = "molmcp.pymol_server.server:main"
chimerax-mcp = "molmcp.chimerax_server.server:main"
molmcp-install = "molmcp.install:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["molmcp"]

[tool.hatch.build.targets.sdist]
include = ["molmcp", "README.md", "pyproject.toml", "install.py", "tests"]
