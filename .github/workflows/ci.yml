name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-pymol:
    # Real Windows: installer, unit tests and the MCP stdio client driving pymol-mcp, which launches a headless
    # PyMOL (open-source wheel) on the runner and renders/analyses frames there.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download the open-source PyMOL wheel (cgohlke)
        shell: bash
        run: |
          WHL=pymol-3.2.0a0-cp311-cp311-win_amd64.whl
          curl -fsSL -o "$WHL" "https://github.com/cgohlke/pymol-open-source-wheels/releases/download/v2026.4.5/$WHL"
          ls -la "$WHL"
      - name: Install numpy, pillow and the PyMOL wheel into the runner's Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow
          python -m pip install --no-deps pymol-3.2.0a0-cp311-cp311-win_amd64.whl
      - name: Check that PyMOL imports (library mode) on Windows
        shell: bash
        run: |
          python -c "import pymol, pymol2, sys; print('pymol import ok on', sys.platform, pymol.__file__)"
          echo "PYMOL_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Bootstrap installer (venv, package, plugin, CLI registrations)
        run: python install.py --pymol --claude --codex
      - name: Show what the installer registered
        shell: bash
        run: |
          ls .venv/Scripts | grep -iE "pymol-mcp|chimerax-mcp|python.exe" || true
          python -c "import json,os; d=json.load(open(os.path.expanduser('~/.claude.json'))); print({k:v['command'] for k,v in d['mcpServers'].items()})"
          ls "$USERPROFILE/AppData/Roaming/pymol/startup" || true
      - name: Unit tests (Windows Python)
        run: .venv\Scripts\python.exe -m unittest discover -s tests -p "test_*.py" -v
      - name: MCP end-to-end (stdio client -> pymol-mcp -> headless PyMOL launched by the server)
        env:
          MOLMCP_PYMOL_LAUNCH_MODE: headless
        shell: bash
        run: |
          .venv/Scripts/python.exe -u tests/e2e_mcp_client.py pymol --launch 2>&1 | grep -vE '^\s+"(rgb|hex|px|frac|ascii)"|^\s+[0-9.,-]+$|^\s+\],?$|^\s+"[^"]*",?$' | tail -120
          test ${PIPESTATUS[0]} -eq 0
      - name: Quit the headless PyMOL started by the server
        shell: bash
        run: |
          .venv/Scripts/python.exe - <<'PY'
          import asyncio, os, sys
          sys.path.insert(0, "tests")
          from e2e_mcp_client import stdio_client, StdioServerParameters, ClientSession, text_of
          async def q():
              p = StdioServerParameters(command=os.path.abspath(".venv/Scripts/pymol-mcp.exe"), args=[], env=dict(os.environ))
              async with stdio_client(p) as (r, w):
                  async with ClientSession(r, w) as s:
                      await s.initialize()
                      print("status:", text_of(await s.call_tool("status", {}))[:200].replace("\n", " "))
                      print("quit:", text_of(await s.call_tool("quit_pymol", {"confirm": True}))[:80].replace("\n", " "))
          asyncio.run(q())
          PY

      - name: chimerax-mcp server on Windows (stdio client; app-independent tools, no ChimeraX installed)
        shell: bash
        run: |
          .venv/Scripts/python.exe - <<'PY'
          import asyncio, os, sys, json, glob
          sys.path.insert(0, "tests")
          from e2e_mcp_client import stdio_client, StdioServerParameters, ClientSession, text_of
          async def go():
              p = StdioServerParameters(command=os.path.abspath(".venv/Scripts/chimerax-mcp.exe"), args=[], env=dict(os.environ, MOLMCP_AUTOLAUNCH="0"))
              async with stdio_client(p) as (r, w):
                  async with ClientSession(r, w) as s:
                      await s.initialize()
                      tools = [t.name for t in (await s.list_tools()).tools]
                      print("tools:", len(tools), sorted(tools)[:12], "...")
                      assert {"run", "scene", "render", "layout", "events", "skills", "measure", "mutate"} <= set(tools), tools
                      st = json.loads(text_of(await s.call_tool("status", {})))
                      print("status:", {k: st.get(k) for k in ("app", "connected", "executable", "hint")})
                      assert st.get("app") == "chimerax" and not st.get("connected")
                      sk = text_of(await s.call_tool("skills", {}))
                      print("skills index:", len(sk), "chars;", sk[:160].replace("\n", " "))
                      assert "publication-rendering" in sk and "maps-and-cryoem" in sk, sk[:400]
                      body = text_of(await s.call_tool("skill", {"name": "publication-rendering"}))
                      assert "render" in body.lower() and len(body) > 500
                      pngs = sorted(glob.glob(os.path.join(os.path.expanduser("~"), ".molmcp", "renders", "*.png")))
                      assert pngs, "no PNG from the PyMOL e2e found"
                      a = json.loads(text_of(await s.call_tool("analyze_image", {"path": pngs[-1]})))
                      print("analyze_image:", a.get("width"), a.get("height"), "coverage", a.get("coverage"), "palette", [x["name"] for x in a.get("palette", [])][:3])
                      assert a.get("coverage", 0) > 0 and a.get("palette"), a
                      r = json.loads(text_of(await s.call_tool("run", {"commands": ["open 1ubq"]})))
                      print("run without ChimeraX:", r.get("error", "")[:120])
                      assert r.get("ok") is False and "chimerax" in r.get("error", "").lower(), r
          asyncio.run(go())
          PY
      - name: Build the ChimeraX bundle wheel on Windows (no ChimeraX needed for the build) and list it
        shell: bash
        run: |
          .venv/Scripts/python.exe - <<'PY'
          import os, sys, zipfile
          sys.path.insert(0, ".")
          from molmcp.install import build_chimerax_wheel
          d = os.path.abspath("dist-ci"); os.makedirs(d, exist_ok=True)
          whl = build_chimerax_wheel(d)
          names = zipfile.ZipFile(whl).namelist()
          print(whl, len(names), "files")
          need = ["chimerax/agentbridge/__init__.py", "chimerax/agentbridge/ops.py", "chimerax/agentbridge/bridgecore.py",
                  "chimerax/agentbridge/agentcli.py", "chimerax/agentbridge/agentchat_ui.py"]
          missing = [n for n in need if not any(x.endswith(n) for x in names)]
          meta = [x for x in names if x.endswith("METADATA")][0]
          text = zipfile.ZipFile(whl).read(meta).decode()
          print([ln for ln in text.splitlines() if "ChimeraX ::" in ln][:6])
          assert not missing, missing
          assert "ChimeraX :: Bundle" in text and "ChimeraX :: Tool" in text
          PY

  windows-pymol-gui:
    permissions:
      contents: read
      statuses: write
    # GUI path on the Windows runner: PyMOL's Qt window with the bridge started via -r, driven through the MCP
    # server.  The runner's OpenGL is Microsoft's 1.1 "GDI Generic", so renders and the ID pass take the bridge's
    # ray-tracer fallback (the same path a VM or remote desktop gets).
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyMOL wheel + PyQt5 + molmcp
        shell: bash
        run: |
          WHL=pymol-3.2.0a0-cp311-cp311-win_amd64.whl
          curl -fsSL -o "$WHL" "https://github.com/cgohlke/pymol-open-source-wheels/releases/download/v2026.4.5/$WHL"
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pyqt5
          python -m pip install --no-deps "$WHL"
          ls "$(python -c 'import sys,os; print(os.path.dirname(sys.executable))')/Scripts" | grep -i pymol || true
          echo "PYMOL_EXE=$(python -c 'import sys,os; print(os.path.join(os.path.dirname(sys.executable), "Scripts", "pymol.exe"))')" >> "$GITHUB_ENV"
          echo "PYMOL_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Installer (plugin into %APPDATA%\pymol\startup via PyMOL's prefs)
        run: python install.py --pymol --claude
      - name: Launch the PyMOL GUI with the bridge (-r launch script) and wait for its discovery file
        shell: bash
        env:
          QT_OPENGL: software
        run: |
          mkdir -p ci-out; exec > >(tee -a ci-out/launch.txt) 2>&1
          python - <<'PY'
          import os, subprocess, time, glob, json, sys
          exe = os.environ["PYMOL_EXE"]; script = os.path.abspath("molmcp/inapp/pymol/molmcp_pymol_launch.py")
          print("launching", exe, "-r", script, flush=True)
          p = subprocess.Popen([exe, "-r", script], creationflags=0x00000008 | 0x00000200,
                               stdin=subprocess.DEVNULL, stdout=open("pymol_gui.log", "w"), stderr=subprocess.STDOUT)
          d = os.path.join(os.path.expanduser("~"), ".molmcp", "instances")
          for i in range(120):
              files = glob.glob(os.path.join(d, "pymol-*.json"))
              if files:
                  print("bridge file:", files[0]); print(open(files[0]).read()[:400]); sys.exit(0)
              if p.poll() is not None:
                  print("pymol exited with", p.returncode); break
              time.sleep(1)
          print("--- pymol_gui.log ---"); print(open("pymol_gui.log", errors="replace").read()[-3000:])
          sys.exit(1)
          PY
      - name: status + run + scene through the MCP server (no rendering)
        shell: bash
        run: |
          mkdir -p ci-out; exec > >(tee -a ci-out/status.txt) 2>&1
          .venv/Scripts/python.exe - <<'PY'
          import asyncio, os, sys, json
          sys.path.insert(0, "tests")
          from e2e_mcp_client import stdio_client, StdioServerParameters, ClientSession, text_of
          async def go():
              p = StdioServerParameters(command=os.path.abspath(".venv/Scripts/pymol-mcp.exe"), args=[], env=dict(os.environ))
              async with stdio_client(p) as (r, w):
                  async with ClientSession(r, w) as s:
                      await s.initialize()
                      st = json.loads(text_of(await s.call_tool("status", {}))); print("status:", {k: st.get(k) for k in ("connected", "connected_pid", "windows")})
                      assert st.get("connected"), st
                      run = json.loads(text_of(await s.call_tool("run", {"commands": ["fragment ala", "show sticks", "orient"]}))); print("run:", run.get("all_ok"), run.get("changes"))
                      assert run.get("all_ok"), run
                      sc = json.loads(text_of(await s.call_tool("scene", {}))); print("scene gui:", sc.get("gui"), [o["name"] for o in sc.get("objects", [])])
                      assert sc.get("gui") is True, sc
          asyncio.run(go())
          PY
      - name: render through the GUI draw path
        shell: bash
        run: |
          mkdir -p ci-out; exec > >(tee -a ci-out/render.txt) 2>&1
          .venv/Scripts/python.exe - <<'PY'
          import asyncio, os, sys, json
          sys.path.insert(0, "tests")
          from e2e_mcp_client import stdio_client, StdioServerParameters, ClientSession, text_of
          async def go():
              p = StdioServerParameters(command=os.path.abspath(".venv/Scripts/pymol-mcp.exe"), args=[], env=dict(os.environ))
              async with stdio_client(p) as (r, w):
                  async with ClientSession(r, w) as s:
                      await s.initialize()
                      r1 = json.loads(text_of(await s.call_tool("render", {"width": 320, "height": 240})))
                      a = r1.get("analysis", {}); print("render:", r1.get("path"), "coverage", a.get("coverage"), "bbox", a.get("bbox"), "palette", [x["name"] for x in a.get("palette", [])][:4], "error", r1.get("error"))
                      assert a.get("coverage", 0) > 0.001, r1
          asyncio.run(go())
          PY
      - name: layout (ID pass) through the GUI
        shell: bash
        run: |
          mkdir -p ci-out; exec > >(tee -a ci-out/layout.txt) 2>&1
          .venv/Scripts/python.exe - <<'PY'
          import asyncio, os, sys, json
          sys.path.insert(0, "tests")
          from e2e_mcp_client import stdio_client, StdioServerParameters, ClientSession, text_of
          async def go():
              p = StdioServerParameters(command=os.path.abspath(".venv/Scripts/pymol-mcp.exe"), args=[], env=dict(os.environ))
              async with stdio_client(p) as (r, w):
                  async with ClientSession(r, w) as s:
                      await s.initialize()
                      lay = json.loads(text_of(await s.call_tool("layout", {"by": "object", "width": 320, "height": 240})))
                      items = lay.get("layout", {}).get("items", []); print("layout:", [(i["label"], i.get("visible"), i.get("pixels")) for i in items], "error", lay.get("error"))
                      assert items and items[0].get("visible"), lay
          asyncio.run(go())
          PY
      - name: Quit the PyMOL window
        if: always()
        shell: bash
        run: |
          mkdir -p ci-out; exec > >(tee -a ci-out/quit.txt) 2>&1
          .venv/Scripts/python.exe - <<'PY' || true
          import asyncio, os, sys
          sys.path.insert(0, "tests")
          from e2e_mcp_client import stdio_client, StdioServerParameters, ClientSession, text_of
          async def q():
              p = StdioServerParameters(command=os.path.abspath(".venv/Scripts/pymol-mcp.exe"), args=[], env=dict(os.environ))
              async with stdio_client(p) as (r, w):
                  async with ClientSession(r, w) as s:
                      await s.initialize()
                      print("quit:", text_of(await s.call_tool("quit_pymol", {"confirm": True}))[:80].replace("\n", " "))
          asyncio.run(q())
          PY

      - name: Publish the step outputs as commit statuses (readable without admin rights)
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import glob, json, os, urllib.request
          parts = []
          for f in sorted(glob.glob("ci-out/*.txt")):
              txt = open(f, errors="replace").read().strip()
              if f.endswith("bisect.txt"):
                  txt = txt[-1500:]
              elif f.endswith("render.txt") or f.endswith("layout.txt"):
                  txt = txt[-600:]
              else:
                  txt = txt[-300:]
              parts.append("[%s] %s" % (os.path.basename(f)[:-4], " ".join(txt.split())))
          try:
              g = open("pymol_gui.log", errors="replace").read().strip()
              parts.append("[pymol_gui.log] " + " ".join(g[-600:].split()))
          except Exception:
              pass
          blob = " || ".join(parts)
          chunks = [blob[i:i + 138] for i in range(0, min(len(blob), 138 * 25), 138)]
          sha, repo, tok = os.environ["GITHUB_SHA"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_TOKEN"]
          for n, c in enumerate(chunks):
              body = json.dumps({"state": "success", "context": "ci-gui-log/%02d" % n, "description": c}).encode()
              req = urllib.request.Request("https://api.github.com/repos/%s/statuses/%s" % (repo, sha), data=body,
                                           headers={"Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json",
                                                    "Content-Type": "application/json"})
              try:
                  urllib.request.urlopen(req, timeout=30).read()
              except Exception as e:
                  print("status post failed:", e); break
          print("posted", len(chunks), "status chunks")
          PY

  linux-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p "test_*.py" -v
